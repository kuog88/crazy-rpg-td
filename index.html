/* ================= 全員瘋子RPG — 直式塔防 =================
   Single file, plain Canvas 2D for the battlefield (light on phone memory), DOM for every button and window.
   Stats, damage, items, enhancement and the dialogue format are copied from the action game (game/index.html):

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) { if (k === 'on') for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); else if (k === 'html') e.innerHTML = attrs.html; else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]); }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}

function rollRarity(boost) {
  // epic and legendary are rare on purpose: normal item ~1.3% epic / 0.2% legendary; boss items ~5% / ~1%
  const w = [62, 27, 9.5, 1.3, 0.2].map((v, i) => i ? v * (1 + boost * i * 0.6) : Math.max(5, v - boost * 20));
  let r = Math.random() * w.reduce((a, b) => a + b);
  for (let i = 0; i < 5; i++) if ((r -= w[i]) < 0) return i;
  return 0;
}
function makeItem(cls, ilvl, boost, slot, wtype, rarity) {
  slot = slot || (Math.random() < 0.6 ? 'weapon' : 'acc'); // towers wear a weapon and an accessory
  rarity = rarity !== undefined ? rarity : rollRarity(boost || 0);
  const rm = 1 + rarity * 0.15;
  const it = { id: uid(), slot, rarity, ilvl, plus: 0, spent: 0, affixes: [], cls, v: randi(0, 1) };
  if (slot === 'weapon') { it.wtype = wtype || WTYPES[cls][randi(0, 2)].id; it.base = Math.round((8 + ilvl * 2) * rm); }
  else if (slot === 'helm') it.base = Math.round((4 + ilvl) * rm);
  else if (slot === 'chest') it.base = Math.round((7 + ilvl * 1.5) * rm);
  else it.base = Math.round((30 + ilvl * 8) * rm);
  const pool = Object.keys(AFFIX).sort(() => Math.random() - 0.5);
  for (let i = 0; i < RAR[rarity].aff; i++) { const a = AFFIX[pool[i]]; it.affixes.push({ k: pool[i], v: randi(a.min, a.max) + Math.floor(ilvl / 5) }); }
  if (RAR[rarity].leg) it.special = Object.keys(SPECIALS)[randi(0, 1)];
  // tower-defence affix: from uncommon up a weapon changes how the tower attacks
  if (slot === 'weapon' && rarity >= 1) it.td = pick(Object.keys(TDAFF));
  return it;
}
const itemBase = it => Math.round(it.base * (1 + 0.1 * it.plus));
function deriveStats(clsKey, ch) {
  const c = CLASSES[clsKey], s = { str: ch.attr.str, agi: ch.attr.agi, int: ch.attr.int, vit: ch.attr.vit, crit: 0, aspd: 0, mspd: 0, steal: 0, cdr: 0, def: 0, hp: 0, atk: 0 };
  const specials = new Set();
  for (const slot in ch.equip) {
    const it = ch.equip[slot]; if (!it) continue;
    const b = itemBase(it);
    if (slot === 'weapon') s.atk += b; else if (slot === 'acc') s.hp += b; else s.def += b;
    for (const a of it.affixes) s[a.k] += a.v;
    if (it.special) specials.add(it.special);
  }
  const lv = ch.lvl;
  return { maxHp: Math.round(c.hp * (1 + 0.06 * (lv - 1)) + s.vit * 15 + s.hp), maxMp: Math.round(c.mp * (1 + 0.03 * (lv - 1))),
    atk: Math.round(c.atk + s.atk + (lv - 1) * 1.5), def: s.def, basicMul: 1 + 0.02 * s.str, skillMul: 1 + 0.02 * s.int,
    cdr: Math.min(0.4, 0.4 * (1 - Math.exp(-s.agi / 40)) + s.cdr / 100), crit: 0.12 + s.crit / 100, aspd: 1 + s.aspd / 100, mspd: 1 + s.mspd / 100,
    steal: s.steal / 100, specials, wtype: ch.equip.weapon ? ch.equip.weapon.wtype : WTYPES[clsKey][0].id, skills: ch.skills.slice(), totals: s };
}

const SEG = []; let PATH_LEN = 0;
for (let i = 1; i < PATH.length; i++) { const l = Math.hypot(PATH[i].x - PATH[i - 1].x, PATH[i].y - PATH[i - 1].y); SEG.push({ a: PATH[i - 1], b: PATH[i], l, s: PATH_LEN }); PATH_LEN += l; }

  const e = PATH[PATH.length - 1]; return { x: e.x, y: e.y, dx: 0 };
}

const SFX = (() => {
  let ctx = null, master = null, last = {};
  function init() { if (ctx) return; try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); } catch (e) { ctx = null; } }
  function tone(f0, f1, dur, vol, type, key, gap) {
    if (!ctx || S.sim) return; const now = ctx.currentTime;
    if (key) { if (last[key] && now - last[key] < (gap || 0.05)) return; last[key] = now; }
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type || 'square';
    o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), now + dur);
    g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(master); o.start(now); o.stop(now + dur + 0.02);
  }
  return {
    init, resume() { init(); if (ctx && ctx.state === 'suspended') ctx.resume(); }, suspend() { if (ctx && ctx.state === 'running') ctx.suspend(); },
    shoot() { tone(900, 500, 0.06, 0.05, 'triangle', 'shoot', 0.06); },
    hit() { tone(300, 90, 0.08, 0.08, 'square', 'hit', 0.05); },
    kill() { tone(500, 1000, 0.08, 0.07, 'square', 'kill', 0.06); },
    coin() { tone(1200, 1800, 0.08, 0.08, 'sine', 'coin', 0.08); },
    leak() { tone(200, 60, 0.4, 0.25, 'sawtooth'); },
    place() { tone(400, 800, 0.12, 0.15, 'triangle'); },
    wave() { tone(520, 520, 0.1, 0.15, 'square'); setTimeout(() => tone(780, 780, 0.16, 0.15, 'square'), 120); },
    ult() { tone(120, 900, 0.5, 0.2, 'sawtooth'); },
    bad() { tone(220, 160, 0.15, 0.12, 'square'); },
    win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, 0.2, 0.15, 'square'), i * 140)); },
    tick() { tone(1500, 1500, 0.015, 0.03, 'square', 'tick', 0.03); }
  };
})();

/* ---------------- story dialogue: portrait, typewriter text, tap to advance (same format as the action game) ---------------- */
const Dialog = {
  open: false, lines: null, i: 0, timer: null, done: null, full: '', shown: 0, cache: {},
  play(lines, onDone) {
    lines = (lines || []).filter(Boolean);
    if (!lines.length || S.sim) { if (onDone) onDone(); return; }
    this.el = $('dlg'); this.L = $('dlgL'); this.R = $('dlgR');
    this.L.style.visibility = 'hidden'; this.R.style.visibility = 'hidden';
    this.lines = lines; this.i = 0; this.done = onDone; this.open = true; this.el.hidden = false;

  },
  srcOf(ln) { return ln.who.startsWith('npc_') ? ART + ln.who + '.webp' : ART + 'portraits/' + ln.who + '_' + (ln.e || 'n') + '.webp'; },
  show() {
    const ln = this.lines[this.i], side = HEROES.includes(ln.who) ? 'L' : 'R';
    const im = side === 'L' ? this.L : this.R, other = side === 'L' ? this.R : this.L, src = this.srcOf(ln);
    if (im.getAttribute('src') !== src) { im.style.visibility = 'hidden'; im.onload = () => { im.style.visibility = 'visible'; }; im.onerror = () => { im.onerror = null; im.src = ART + ln.who + '.webp'; }; im.src = src; if (im.complete && im.naturalWidth) im.style.visibility = 'visible'; }
    else im.style.visibility = 'visible';
    im.classList.remove('dim'); other.classList.add('dim');

    this.full = ln.t; this.shown = 0;
    clearInterval(this.timer);
    const out = $('dlgText'); out.textContent = '';
    this.timer = setInterval(() => { this.shown++; out.textContent = this.full.slice(0, this.shown); if (this.shown % 2 === 0) SFX.tick(); if (this.shown >= this.full.length) { clearInterval(this.timer); this.timer = null; } }, 28);
  },
  next() {
    if (!this.open) return;
    if (this.timer) { clearInterval(this.timer); this.timer = null; $('dlgText').textContent = this.full; return; }
    this.i++; if (this.i >= this.lines.length) this.finish(); else this.show();
  },

/* ================= phone hardening (same fixes as the action game) ================= */
// unlock audio on the first gesture anywhere

const ExitGuard = {
  leaving: false,
  init() {
    try { history.pushState({ guard: 1 }, ''); } catch (e) {}

  }

/* layout: a 9:16 frame. The keyboard / voice input squeezes the height for a moment — a sudden big height drop at the same

let lastW = 0, lastH = 0;

  const vv = window.visualViewport, zoomed = vv && vv.scale > 1.02;
  let vw = zoomed ? vv.width : window.innerWidth, vh = zoomed ? vv.height : window.innerHeight;
  if (!zoomed && IS_TOUCH && Math.abs(vw - lastW) < 2 && vh < lastH * 0.75) vh = lastH; // keyboard squeeze
  lastW = vw; lastH = vh;
  const W = Math.min(vw, Math.round(vh * 9 / 16 > vw ? vw : vh * 9 / 16)), H = vh;
  const app = $('app');
  Object.assign(app.style, { width: W + 'px', height: H + 'px', left: ((zoomed ? vv.offsetLeft : 0) + (vw - W) / 2) + 'px', top: (zoomed ? vv.offsetTop : 0) + 'px' });

  const vv = window.visualViewport; if (!vv || vv.scale < 1.02) return;

  const c = m.getAttribute('content'); m.setAttribute('content', c + ', minimum-scale=1'); setTimeout(() => m.setAttribute('content', c), 60);
};
const snapBack = () => { unzoom(); layout(); const z = window.visualViewport && window.visualViewport.scale > 1.02; if (!z && (window.scrollX || window.scrollY)) window.scrollTo(0, 0); };

if (window.visualViewport) { window.visualViewport.addEventListener('resize', snapBack); window.visualViewport.addEventListener('scroll', snapBack); }
// leaving the page for a moment: mute, and pick things back up on return
const awayOn = () => { BGM.stop(); SFX.suspend(); releaseTouch(); };
const awayOff = () => { if (document.hidden) return; SFX.resume(); BGM.kick(); snapBack(); lastT = performance.now(); };

/* ---------------- testing hook: play a whole run headless with fixed placements ---------------- */
window.TD = {
  S, Save, TUNE,
  advance(sec) { for (let i = 0; i < sec * 30 && S.phase !== 'over'; i++) step(1 / 30); draw(performance.now()); updateTop(); updateLive(); return S.phase + ' w' + S.wave + ' lives ' + S.lives + ' gold ' + S.gold; },
  sim(placements, opts) { // placements: [[cls, c, r, beforeWave]]; returns the result of a full run

      if (opts && opts.ult && S.phase === 'wave') for (const tw of S.towers) if (ultReady(tw) && alive().filter(e => Math.hypot(e.x - tw.x, e.y - tw.y) <= tw.range).length >= 3) castUlt(tw);

const fontReady = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load('900 20px "Noto Serif TC"', '全員瘋子RPG'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
