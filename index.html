for (let i = 1; i < PATH.length; i++) { const l = Math.hypot(PATH[i].x - PATH[i - 1].x, PATH[i].y - PATH[i - 1].y); SEG.push({ a: PATH[i - 1], b: PATH[i], l, s: PATH_LEN }); PATH_LEN += l; }

/* ---------------- simulation step ---------------- */
function step(dt) {

    if (e.aff.includes('summon') && (e.timers.summon -= dt) <= 0) { e.timers.summon = 6; spawn('hydra', false, false, Math.max(0, e.d - 20)); }

    if (tw.hitFx > 0) tw.hitFx -= dt;
    if (tw.bubble && (tw.bubble.t -= dt / Math.max(1, S.speed)) <= 0) tw.bubble = null;
    for (let i = 0; i < 2; i++) if (tw.scd[i] > 0) tw.scd[i] -= dt;
    for (const k of ['frenzyT', 'drT', 'tauntT', 'lsT', 'abT', 'shieldT']) if (tw[k] > 0) tw[k] -= dt;
    if (tw.shieldT <= 0) tw.shieldHP = 0;
    if (tw.hotT > 0) { tw.hotT -= dt; healHero(tw, tw.hot * dt); }
    if (tw.down > 0) { tw.down -= dt; if (tw.down <= 0) { tw.hp = tw.maxHp * 0.5; if (!S.sim) { say(tw, pick(BANTER[tw.cls].revive), true); renderBottom(); } } continue; }

  const rw = { won, cleared, gold: won ? 1500 + 300 * (d.crazy || 0) : 100 * cleared, crystals: won ? 6 + (d.crazy || 0) : Math.floor(cleared / 3), shards: won ? 15 : cleared, items: [], ups: [], burned: 0 };

  show() {

    const im = side === 'L' ? this.L : this.R, other = side === 'L' ? this.R : this.L, src = this.srcOf(ln);
    if (im.getAttribute('src') !== src) { im.style.visibility = 'hidden'; im.onload = () => { im.style.visibility = 'visible'; }; im.onerror = () => { im.onerror = null; im.src = ART + ln.who + '.webp'; }; im.src = src; if (im.complete && im.naturalWidth) im.style.visibility = 'visible'; }
    else im.style.visibility = 'visible';
    im.classList.remove('dim'); other.classList.add('dim');
    $('dlgName').textContent = SPEAKER[ln.who] || ln.who;
    this.full = ln.t; this.shown = 0;
    clearInterval(this.timer);
    const out = $('dlgText'); out.textContent = '';
    this.timer = setInterval(() => { this.shown++; out.textContent = this.full.slice(0, this.shown); if (this.shown % 2 === 0) SFX.tick(); if (this.shown >= this.full.length) { clearInterval(this.timer); this.timer = null; } }, 28);
  },
  next() {
    if (!this.open) return;
    if (this.timer) { clearInterval(this.timer); this.timer = null; $('dlgText').textContent = this.full; return; }
    this.i++; if (this.i >= this.lines.length) this.finish(); else this.show();
  },
  finish() { if (!this.open) return; clearInterval(this.timer); this.timer = null; this.open = false; this.el.hidden = true; const cb = this.done; this.done = null; if (cb) cb(); }
};
$('dlg').addEventListener('pointerdown', e => { if (e.target.id !== 'dlgSkip') { e.preventDefault(); Dialog.next(); } });
$('dlgSkip').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); Dialog.finish(); });
const KEYS = {};
window.addEventListener('keydown', e => {
  if (Dialog.open) { if (['Space', 'Enter', 'KeyA', 'NumpadEnter'].includes(e.code)) { e.preventDefault(); if (!e.repeat) Dialog.next(); } else if (e.code === 'Escape') { e.preventDefault(); Dialog.finish(); } return; }
  if (!$('modal').hidden) { if (e.code === 'Escape' && !$('mClose').hidden) Modal.close(); return; }
  if (V.active) {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); V.hold = 1; KEYS.v = 1; }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); V.hold = -1; KEYS.v = -1; }
    else if ((e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyA') && V.near && !e.repeat) { e.preventDefault(); talkTo(V.near.id); }
    else if (e.code === 'KeyI' || e.code === 'KeyC') openParty();
    else if (e.code === 'Escape') openMenu();
    return;
  }
  if (S.phase === 'off') return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); startWave(); }
  else if (e.code === 'Escape') { if (S.sel || S.selCard) { S.sel = S.selCard = null; renderBottom(); } else openMenu(); }
  else if (/^Digit[1-6]$/.test(e.code)) { const cls = HEROES[+e.code.slice(5) - 1]; const tw = S.towers.find(t => t.cls === cls); if (tw) { S.sel = tw; S.selCard = null; } else { S.selCard = cls; S.sel = null; } renderBottom(); }
  else if ((e.code === 'KeyQ' || e.code === 'KeyE') && S.sel) castSkill(S.sel, e.code === 'KeyQ' ? 0 : 1, true);
});
window.addEventListener('keyup', e => { if (V.active && ['ArrowUp', 'KeyW', 'ArrowDown', 'KeyS'].includes(e.code)) V.hold = 0; });

/* ================= main loop ================= */
let lastT = performance.now(), uiT = 0;
const battlePaused = () => S.phase === 'off' || S.phase === 'over' || !$('modal').hidden || Dialog.open || document.hidden;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (V.active) {
    if ($('modal').hidden && !Dialog.open) villageStep(dt); else V.hold = 0;
    drawVillage(now); return;
  }
  if (S.phase === 'off') return;
  if (!battlePaused()) {
    let left = dt * S.speed;
    while (left > 0) { const d = Math.min(left, 1 / 30); step(d); left -= d; }
    if (flashGate > 0) flashGate -= dt;
    NpcEv.tick(dt);
  }
  draw(now);
  if ((uiT -= dt) <= 0) { uiT = 0.2; updateTop(); updateLive(); }
}
requestAnimationFrame(frame);

/* ================= phone hardening (same fixes as the action game) ================= */
['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, () => { SFX.resume(); BGM.kick(); }, { passive: true }));
const ExitGuard = {
  leaving: false,
  init() {
    try { history.pushState({ guard: 1 }, ''); } catch (e) {}
    window.addEventListener('popstate', () => { // the phone's back gesture closes the open window or opens the menu instead of leaving
      if (this.leaving) return;
      try { history.pushState({ guard: 1 }, ''); } catch (e) {}
      if (Dialog.open) return;
      if (!$('modal').hidden) { if (!$('mClose').hidden) Modal.close(); return; }
      openMenu();
    });
    window.addEventListener('beforeunload', e => { if (!this.leaving && (S.phase === 'wave' || S.phase === 'build')) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault()); // iOS pinch zoom
    ['gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
    // iPhone ignores "no zoom" in the page settings: swallow the second tap of a quick double tap and pass it on as a click
    let lastEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now(), t = e.target;
      if (now - lastEnd < 350 && e.cancelable && !(t && /INPUT|TEXTAREA|SELECT/.test(t.tagName))) {
        e.preventDefault();
        const b = t && t.closest && t.closest('button, [role=button]'); if (b && t !== cv && t !== vc && !b.closest('#vCtl')) b.click();
      }
      lastEnd = now;
    }, { passive: false });
    document.addEventListener('touchmove', e => { if (e.touches.length > 1 && e.cancelable) e.preventDefault(); }, { passive: false });
  }
};
ExitGuard.init();
/* layout: a 9:16 frame. A sudden big height drop at the same width (keyboard / voice input) is ignored; if the page got
   zoomed anyway (some in-app browsers), the frame is laid over exactly the part you can see. */
let lastW = 0, lastH = 0;
function layout() {
  const vv = window.visualViewport, zoomed = vv && vv.scale > 1.02;
  const vw = zoomed ? vv.width : window.innerWidth; let vh = zoomed ? vv.height : window.innerHeight;
  if (!zoomed && IS_TOUCH && Math.abs(vw - lastW) < 2 && vh < lastH * 0.75) vh = lastH;
  lastW = vw; lastH = vh;
  const W = Math.min(vw, Math.round(vh * 9 / 16)), H = vh;
  const app = $('app');
  Object.assign(app.style, { width: W + 'px', height: H + 'px', left: ((zoomed ? vv.offsetLeft : 0) + (vw - W) / 2) + 'px', top: (zoomed ? vv.offsetTop : 0) + 'px' });
  app.style.setProperty('--u', (W / 540) + 'px');
  const topH = $('top').offsetHeight, size = Math.floor(Math.min(W, H - topH - W * 0.5));
  const f = $('field'); f.style.width = size + 'px'; f.style.height = size + 'px';
  if (Math.abs(size - CSS_S) > 1 || cv.width !== Math.round(size * Math.min(2, window.devicePixelRatio || 1))) resizeCanvas(size);
  if (V.active) resizeVillage();
}
const unzoom = () => {
  const vv = window.visualViewport; if (!vv || vv.scale < 1.02) return;
  const m = document.querySelector('meta[name=viewport]'); if (!m) return;
  const c = m.getAttribute('content'); m.setAttribute('content', c + ', minimum-scale=1'); setTimeout(() => m.setAttribute('content', c), 60);
};
const snapBack = () => { unzoom(); layout(); const z = window.visualViewport && window.visualViewport.scale > 1.02; if (!z && (window.scrollX || window.scrollY)) window.scrollTo(0, 0); };
window.addEventListener('resize', snapBack);
window.addEventListener('orientationchange', () => [80, 350, 900].forEach(t => setTimeout(snapBack, t)));
if (window.visualViewport) { window.visualViewport.addEventListener('resize', snapBack); window.visualViewport.addEventListener('scroll', snapBack); }
const awayOn = () => { BGM.stop(); SFX.suspend(); releaseTouch(); };
const awayOff = () => { if (document.hidden) return; SFX.resume(); BGM.kick(); snapBack(); lastT = performance.now(); };
document.addEventListener('visibilitychange', () => document.hidden ? awayOn() : awayOff());
window.addEventListener('pagehide', awayOn);
window.addEventListener('pageshow', awayOff);

/* ---------------- testing hooks: a whole battle headless, or advancing time while the pane is hidden ---------------- */
window.TD = {
  S, Save, TUNE, V,
  walk(dir, sec) { V.hold = dir; for (let i = 0; i < sec * 30; i++) villageStep(1 / 30); V.hold = 0; villageStep(0); drawVillage(performance.now()); return V.t.toFixed(2) + ' ' + (V.near ? V.near.id : '-'); },
  advance(sec) { for (let i = 0; i < sec * 30 && S.phase !== 'over'; i++) step(1 / 30); draw(performance.now()); updateTop(); updateLive(); return S.phase + ' w' + S.wave + ' lives ' + S.lives + ' gold ' + S.gold; },
  sim(placements, opts) { // placements: [[cls, c, r]]; heroes auto-cast their two skills
    const keepSpeed = S.speed; S.sim = true; newRun(); S.sim = true; S.leakLog = [];
    let guard = 0; const log = [], downs = {};
    while (S.phase !== 'over' && guard++ < 200000) {
      if (S.phase === 'build') { log.push(S.lives); for (const p of placements) placeTower(p[0], p[1], p[2], true); startWave(); }
      for (const tw of S.towers) if (tw.down > 0 && !tw.__d) { tw.__d = 1; downs[tw.cls] = (downs[tw.cls] || 0) + 1; } else if (tw.down <= 0) tw.__d = 0;
      step(1 / 30);
    }
    const res = { won: S.lives > 0, wave: S.wave, lives: S.lives, log: log.join(','), downs: JSON.stringify(downs), towers: S.towers.map(t => t.cls + ':' + Math.round(t.stats.dmg) + '/' + Math.round(t.stats.taken)).join(' ') };
    S.sim = false; S.speed = keepSpeed; S.phase = 'off'; S.towers = []; S.enemies = [];
    return res;
  }
};

layout();
const fontReady = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load('900 20px "Noto Serif TC"', '全員瘋子RPG'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
fontReady.then(() => { layout(); goVillage(); });
</script>
