const BEATS = { earth: 'water', water: 'fire', fire: 'wind', wind: 'earth' };
function elemMul(a, d) { if (!a || !d) return 1; if (BEATS[a] === d) return 1.3; if (BEATS[d] === a) return 0.8; return 1; }
const MON_EL = { hydra: 'water', fish: 'water', wolf: 'wind', mud: 'earth', gargoyle: 'earth', boss: 'earth' };

// pets: every stat has a hidden grade 1–10 that you only find out after the capture, plus one special trait
const GRADE_STATS = [['hp', '血量'], ['atk', '攻擊'], ['def', '防禦'], ['spd', '速度']];
const TRAITS = {
  none: { n: '普通', d: '沒有特別的地方。普通到有點可憐。' },
  thick: { n: '皮厚', d: '受到的傷害 -15%' },

  greedy: { n: '貪吃', d: '戰鬥贏了多拿 15% 金幣' }
};
function rollGrade(bonus) { return clamp(Math.round((Math.random() + Math.random() + Math.random()) / 3 * 9 + 1 + (bonus || 0)), 1, 10); }
function rollPet(type, lvl, elite) {
  const g = {}; for (const [k] of GRADE_STATS) g[k] = rollGrade(elite ? 1.5 : 0);
  const trait = Math.random() < 0.3 ? 'none' : pick(Object.keys(TRAITS).filter(k => k !== 'none'));
  return { id: uid(), type, name: ENEMY[type].name, lvl, exp: 0, hp: null, g, trait };
}
const petScore = p => Math.round(GRADE_STATS.reduce((a, [k]) => a + p.g[k], 0) / GRADE_STATS.length * 10) / 10;
const scoreRank = s => s >= 8.5 ? ['S', '#ff9a2e'] : s >= 7 ? ['A', '#c07bff'] : s >= 5.5 ? ['B', '#4aa3ff'] : s >= 4 ? ['C', '#6fe06a'] : ['D', '#bbbbbb'];
const gm = g => 0.6 + 0.08 * g; // grade 1 → 68%, 5 → 100%, 10 → 140%

// turn-based tuning (monster HP x base, monster attack x base, experience x base)
const TB = { mob: 1.2, elite: 2.4, boss: 0.55, atk: 0.62, exp: 0.7 };
function monsterStats(type, lv, elite, boss) {
  const b = ENEMY[type];
  const hp = Math.round(b.hp * (boss ? TB.boss : elite ? TB.elite : TB.mob) * (1 + 0.15 * (lv - 1)));
  return { hp, maxHp: hp, atk: Math.round(b.atk * TB.atk * (1 + 0.08 * (lv - 1)) * (elite ? 1.3 : 1)), spd: b.speed + lv * 2, armor: b.armor || 0 };
}
function petStats(p) {
  const b = ENEMY[p.type], lv = p.lvl, g = p.g || { hp: 5, atk: 5, def: 5, spd: 5 }, tr = p.trait;
  let maxHp = Math.round(b.hp * 0.9 * gm(g.hp) * (1 + 0.12 * (lv - 1))), atk = Math.round(b.atk * 0.3 * gm(g.atk) * (1 + 0.1 * (lv - 1)));
  let def = Math.round((lv * 2 + 4 + (p.type === 'gargoyle' ? 10 : 0)) * gm(g.def)), spd = Math.round((b.speed + lv * 2) * (0.8 + 0.04 * g.spd));
  if (tr === 'quick') spd = Math.round(spd * 1.2);
  if (tr === 'hot') { atk = Math.round(atk * 1.15); def = Math.round(def * 0.9); }
  return { maxHp, atk, def, spd, crit: tr === 'lucky' ? 0.23 : 0.08 };
}

const FMAP = (() => {

    document.addEventListener('gesturestart', e => e.preventDefault()); // iOS pinch zoom
    ['gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

    let lastEnd = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now(), t = e.target;
      if (now - lastEnd < 350 && e.cancelable && !(t && /INPUT|TEXTAREA|SELECT/.test(t.tagName))) {
        e.preventDefault();
        const b = t && t.closest && t.closest('button, [role=button]'); if (b && t.tagName !== 'CANVAS' && !b.closest('#vCtl')) b.click();

ExitGuard.init();
/* layout: a 9:16 frame. A sudden big height drop at the same width (keyboard / voice input) is ignored; if the page got

let lastW = 0, lastH = 0;
function layout() {
  const vv = window.visualViewport, zoomed = vv && vv.scale > 1.02;
  const vw = zoomed ? vv.width : window.innerWidth; let vh = zoomed ? vv.height : window.innerHeight;
  if (!zoomed && IS_TOUCH && Math.abs(vw - lastW) < 2 && vh < lastH * 0.75) vh = lastH;
  lastW = vw; lastH = vh;
  const W = Math.min(vw, Math.round(vh * 9 / 16)), H = vh;
  const app = $('app');
  Object.assign(app.style, { width: W + 'px', height: H + 'px', left: ((zoomed ? vv.offsetLeft : 0) + (vw - W) / 2) + 'px', top: (zoomed ? vv.offsetTop : 0) + 'px' });
  app.style.setProperty('--u', (W / 540) + 'px');
  if (V.active) V.LH = resizeCanvasTo(vc) || V.LH;
  if (F.active) F.LH = resizeCanvasTo(fc) || F.LH;
  if (B && !$('battle').hidden) B.LH = resizeCanvasTo(bc) || B.LH;
}
const unzoom = () => {
  const vv = window.visualViewport; if (!vv || vv.scale < 1.02) return;
  const m = document.querySelector('meta[name=viewport]'); if (!m) return;

const snapBack = () => { unzoom(); layout(); const z = window.visualViewport && window.visualViewport.scale > 1.02; if (!z && (window.scrollX || window.scrollY)) window.scrollTo(0, 0); };
window.addEventListener('resize', snapBack);

if (window.visualViewport) { window.visualViewport.addEventListener('resize', snapBack); window.visualViewport.addEventListener('scroll', snapBack); }
const awayOn = () => { BGM.stop(); SFX.suspend(); releaseTouch(); };
const awayOff = () => { if (document.hidden) return; SFX.resume(); BGM.kick(); snapBack(); lastT = performance.now(); };
document.addEventListener('visibilitychange', () => document.hidden ? awayOn() : awayOff());
window.addEventListener('pagehide', awayOn);
window.addEventListener('pageshow', awayOff);

/* ---------------- testing hooks ---------------- */
window.TD = {
  Save, F, V, TB, get B() { return B; },
  walk(dir, sec) { V.hold = dir; for (let i = 0; i < sec * 30; i++) villageStep(1 / 30); V.hold = 0; villageStep(0); drawVillage(performance.now()); return V.t.toFixed(2) + ' ' + (V.near ? V.near.id : '-'); },
  fwalk(dx, dy, sec) { F.hold = { x: dx, y: dy }; for (let i = 0; i < sec * 30 && F.active; i++) fieldStep(1 / 30); F.hold = null; if (F.active) drawField(performance.now()); return Math.floor(F.x / FT) + ',' + Math.floor(F.y / FT) + (B ? ' battle' : ''); },
  // n auto battles headless in a zone; HP carries over between fights like on the map unless heal; save restored afterwards
  async sim(n, zone, heal) {
    SIM.on = true; const out = { win: 0, lose: 0, rounds: 0 };
    const keep = JSON.stringify(Save.d);
    for (let i = 0; i < n; i++) {
      if (heal) healAll();
      const z = ZONES[zone], list = []; for (let k = 0, m = randi(z.count[0], z.count[1]); k < m; k++) list.push({ type: pick(z.mobs), lvl: randi(z.lv[0], z.lv[1]) });

      let g = 0; while (!B.result && g++ < 80) await resolveRound();
      out[B.result === 'win' ? 'win' : 'lose']++; out.rounds += B.round;
      if (B.result === 'lose') healAll();
    }
    const lv = Save.d.party.map(c => heroCh(c).lvl + ':' + Math.round(curHp(c) / heroStats(c, heroCh(c)).maxHp * 100) + '%').join(' ');
    Save.d = JSON.parse(keep); Save.write();

  }
};

layout();
